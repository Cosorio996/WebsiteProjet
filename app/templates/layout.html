<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title or "Dashboard de Riesgos" }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Librería de iconos FontAwesome para un diseño de ciberseguridad industrial real -->
    <link href="https://cloudflare.com" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
        }

        .app-layout {
            display: flex;
            min-height: 100vh;
        }

        /* DISEÑO DE MENÚ LATERAL ESTILO NOZOMI VANTAGE */
        .sidebar {
            width: 240px;
            background-color: #1e293b; /* Gris oscuro corporativo */
            padding: 0;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        .sidebar-brand {
            padding: 24px 20px;
            font-weight: 700;
            font-size: 1.1rem;
            color: #38bdf8; /* Azul tecnológico de Nozomi */
            letter-spacing: 0.5px;
            border-bottom: 1px solid #334155;
            text-transform: uppercase;
        }

        .sidebar .nav-container {
            padding: 15px 0;
        }

        .sidebar .nav-link {
            color: #94a3b8; /* Gris claro sutil para el texto base */
            display: block;
            padding: 12px 20px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            border-left: 4px solid transparent;
            transition: all 0.2s ease;
        }

        /* Animación interactiva verde como tus botones de Guardar y Procesar */
        .sidebar .nav-link:hover {
            background-color: #334155;
            color: #ffffff;
            padding-left: 24px;
            border-left-color: #198754; 
        }

        /* Resaltado fijo para la sección en la que el cliente está parado */
        .sidebar .nav-link.active {
            background-color: #0f172a;
            color: #ffffff;
            border-left-color: #198754;
        }

                
        .main-content {
            flex: 1;
            padding: 15px; /* Reducimos el margen interno de 25px a 15px para ganar espacio */
            font-size: 0.9rem; /* Achica sutilmente los textos generales */
              
        }

        .page-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- MENÚ LATERAL MEJORADO -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <i class="fa-solid fa-shield-halved me-2"></i> SAGER
            </div>
            <div class="nav-container flex-column">
                <!-- Se inyecta la clase 'active' dinámicamente según la ruta de Flask actual -->
                <a class="nav-link {% if request.path == url_for('dashboard') %}active{% endif %}" href="{{ url_for('dashboard') }}">
                    <i class="fa-solid fa-chart-pie me-2" style="width: 18px;"></i>A. Dashboard
                </a>
                <a class="nav-link {% if request.path == url_for('ver_direcciones') %}active{% endif %}" href="{{ url_for('ver_direcciones') }}">
                    <i class="fa-solid fa-network-wired me-2" style="width: 18px;"></i>B. Direcciones
                </a>
                <a class="nav-link {% if request.path == url_for('ver_activos') %}active{% endif %}" href="{{ url_for('ver_activos') }}">
                    <i class="fa-solid fa-boxes-stacked me-2" style="width: 18px;"></i>C. Activos
                </a>
                <a class="nav-link {% if request.path == url_for('ver_amenazas') %}active{% endif %}" href="{{ url_for('ver_amenazas') }}">
                    <i class="fa-solid fa-biohazard me-2" style="width: 18px;"></i>D. Amenazas
                </a>
                <a class="nav-link {% if request.path == url_for('ver_riesgos') %}active{% endif %}" href="{{ url_for('ver_riesgos') }}">
                    <i class="fa-solid fa-triangle-exclamation me-2" style="width: 18px;"></i>E. Riesgos
                </a>
            </div>
        </aside>

        <main class="main-content">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, msg in messages %}
                        <div class="alert alert-{{ category }} mb-3">{{ msg }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
